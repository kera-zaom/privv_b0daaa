<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختباراتي | الخوارزمي</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 10%, rgba(116,72,232,.25), transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(49,84,223,.20), transparent 35%),
                #050509;
            color: white;
            padding: 25px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            color: #999;
            margin-top: 6px;
        }

        .back {
            text-decoration: none;
            color: white;
            padding: 11px 18px;
            border-radius: 12px;
            background: linear-gradient(135deg,#7448e8,#3154df);
        }

        #loading,
        #empty,
        #error {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }

        #error {
            color: #ff7d88;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(17,17,28,.9);
            border: 1px solid rgba(140,100,255,.2);
            border-radius: 20px;
            padding: 22px;
            transition: .25s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(140,100,255,.55);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .description {
            color: #999;
            line-height: 1.7;
            min-height: 50px;
            margin-bottom: 18px;
        }

        .info {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .badge {
            background: #0b0b13;
            border: 1px solid #29293b;
            padding: 7px 10px;
            border-radius: 9px;
            color: #bbb;
            font-size: 13px;
        }

        .start {
            width: 100%;
            border: 0;
            padding: 13px;
            border-radius: 12px;
            background: linear-gradient(135deg,#7448e8,#3154df);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .start:hover {
            opacity: .9;
        }

        @media(max-width:600px) {
            body {
                padding: 15px;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .back {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div>
            <h1>📝 الاختبارات المتاحة</h1>
            <p id="studentGrade">جاري تحميل الصف...</p>
        </div>

        <a href="home.html" class="back">
            العودة للرئيسية
        </a>
    </header>

    <div id="loading">
        جاري تحميل الاختبارات...
    </div>

    <div id="error" style="display:none;"></div>

    <div id="empty" style="display:none;">
        لا توجد اختبارات متاحة حاليًا.
    </div>

    <div id="testsGrid" class="grid"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="js/tests.js"></script>

</body>
</html>
